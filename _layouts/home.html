---
layout: default
---
<div class="home">
  {{ content }}
  <ul class="blog-posts">
  {% for post in site.posts %}{% unless post.draft %}
    <li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %b, %Y" }}</time><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
  {% endunless %}{% endfor %}
  </ul>
</div>
