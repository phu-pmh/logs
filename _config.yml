# # # # # # # #
#   K i k o   #
# # # # # # # #

# Basic
name:               "PM"

# URL
url:                "https://phu-pmh.github.io" # the base hostname & protocol for your site
# url:                "http://localhost:4000" # use this url when you develop
baseurl:            "/logs"
#baseurl:            "" #For Root Domain
permalink:          /:year/:month/:day/:title.html

# Markdown
markdown:           kramdown
kramdown:
  input:            GFM

# Navigation
nav:
  - name:           "About"
    href:           "https://phu-pmh.github.io/logs/about"
 
# Disqus
disqus:
  id:               "pensieve-1"


# Sass
sass:
  style:            :compressed

# Scopes
defaults:
  -
    scope:
      path:         ""
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      path:         ""
      type:         "posts"
    values:
      layout:       "post"
